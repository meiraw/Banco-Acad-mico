spring.application.name=banco.academico

spring.datasource.url=jdbc:postgresql://localhost:5433/academicos
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
security.jwt.secret=${JWT_SECRET}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Credenciais apenas no ambiente. Não habilitar debug SMTP em produção.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.recuperacao.remetente=${SMTP_FROM:nao-responda@localhost}
app.recuperacao.url=${PASSWORD_RESET_URL:http://localhost:5173/redefinir-senha}
