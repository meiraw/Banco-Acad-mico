spring.application.name=banco.academico
spring.config.import=optional:file:./.env[.properties]
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/academicos
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
app.upload.raiz=${UPLOAD_ROOT:Uploads}
app.upload.cota-usuario=${UPLOAD_USER_QUOTA_BYTES:524288000}
app.upload.reserva-disco=${UPLOAD_DISK_RESERVE_BYTES:104857600}
app.upload.concorrencia=${UPLOAD_CONCURRENCY:2}
app.upload.tentativas-15min=${UPLOAD_ATTEMPTS_15MIN:20}
app.upload.bytes-15min=${UPLOAD_BYTES_15MIN:104857600}
app.upload.antimalware.habilitado=${UPLOAD_ANTIMALWARE_ENABLED:false}
app.upload.antimalware.host=${CLAMAV_HOST:localhost}
app.upload.antimalware.porta=${CLAMAV_PORT:3310}
app.upload.antimalware.timeout-ms=${CLAMAV_TIMEOUT_MS:15000}
security.jwt.secret=${JWT_SECRET}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Credenciais apenas no ambiente. Não habilitar debug SMTP em produção.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.recuperacao.remetente=${SMTP_FROM:nao-responda@localhost}
app.recuperacao.url=${PASSWORD_RESET_URL:http://localhost:5173/redefinir-senha}
app.confirmacao.url=${EMAIL_CONFIRMATION_URL:http://localhost:5173/confirmar-email}
app.moderacao.email-admin=${MODERATION_ADMIN_EMAIL:}
