name: banco-academico

# Aplicar ao serviço backend quando ele for incluído na etapa de deploy.
x-armazenamento-backend:
  environment:
    UPLOAD_ROOT: /data/uploads
    UPLOAD_LEGACY_ROOTS: ${UPLOAD_LEGACY_ROOTS:-}
  volumes:
    - arquivos-academicos:/data/uploads

services:
  arquivos:
    image: postgres:17
    profiles: [manutencao]
    network_mode: none
    entrypoint: [/bin/sh]
    volumes:
      - arquivos-academicos:/data/uploads
  clamav:
    image: clamav/clamav:stable
    profiles: [antimalware]
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - assinaturas-antimalware:/var/lib/clamav
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: academicos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina a senha no .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dados-academicos:/var/lib/postgresql/data

volumes:
  arquivos-academicos:
  assinaturas-antimalware:
  dados-academicos:
